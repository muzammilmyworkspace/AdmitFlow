<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The AdmitFlow mark, matching src/components/brand/Logo.tsx. A rounded navy tile so
       the mark stays legible at 16px in a browser tab, where a bare stroke would vanish. -->
  <defs>
    <linearGradient id="af-icon" x1="4" y1="28" x2="28" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FB47F" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0A2540" />
  <circle
    cx="16"
    cy="16"
    r="10.5"
    stroke="url(#af-icon)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-dasharray="48 18"
    transform="rotate(-38 16 16)"
  />
  <path
    d="M11.4 19.4 L15 15 L17.8 17.4 L22 11.2"
    stroke="url(#af-icon)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M18.9 10.7 L22.5 10.5 L22.3 14.1"
    stroke="url(#af-icon)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
